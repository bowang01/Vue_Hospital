services:
  frontend:
    build: .
    container_name: hospital-front
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VUE_APP_BASE_API: /hospital
    networks:
      - proxy
      - default

networks:
  proxy:
    name: proxy
    external: true
